apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligent-ai-order-support
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intelligent-ai-order-support
  template:
    metadata:
      labels:
        app: intelligent-ai-order-support
    spec:
      containers:
        - name: app
          image: gcr.io/PROJECT_ID/intelligent-ai-order-support:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: mongodb-uri
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: openai-api-key
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: mcp-api-key
            - name: COPILOT_POLICY_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: copilot-policy-agent-api-key
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: intelligent-ai-order-support
spec:
  selector:
    app: intelligent-ai-order-support
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
